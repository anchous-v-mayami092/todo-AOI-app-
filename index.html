<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Manager</title>
    <!-- Подключаем шрифт Inter, фреймворк Tailwind CSS и иконки Font Awesome -->
    <link href="https://googleapis.com" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> <!--ссылка другая так как обычную на tailwindcss провайдер блокирует!-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        /* Базовый шрифт для всей страницы */
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        /* Стили для выполненной задачи: зачеркнутый текст и полупрозрачность */
        .task-completed {
            text-decoration: line-through;
            opacity: 0.6;
        }
        /* Подсветка активной кнопки фильтрации задач */
        .filter-btn.active {
            background-color: #10b981;
            color: white;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
        }
    </style>
</head>
<body class="bg-zinc-950 min-h-screen py-10 text-zinc-200">
    <!-- Главный контейнер приложения -->
    <div class="max-w-2xl mx-auto bg-zinc-900 rounded-3xl shadow-2xl overflow-hidden border border-zinc-800">
        
        <!-- Шапка с заголовком -->
        <div class="bg-black text-white p-8">
            <h1 class="text-4xl font-bold tracking-tighter">Todo AOI</h1>
        </div>

        <!-- Основная рабочая область -->
        <div class="p-8">
            <!-- Форма добавления новой задачи и выбора её приоритета -->
            <form id="taskForm" class="flex gap-3 mb-8">
                <input type="text" id="taskInput" 
                       class="flex-1 bg-zinc-800 border border-zinc-700 rounded-2xl px-6 py-4 focus:outline-none focus:border-emerald-500 text-lg placeholder-zinc-500" 
                       placeholder="Что нужно сделать?" required>
                
                <select id="prioritySelect" 
                        class="bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-4 text-zinc-300 focus:outline-none focus:border-emerald-500">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>

                <button type="submit" 
                        class="bg-emerald-600 hover:bg-emerald-500 px-10 rounded-2xl text-white font-medium transition-all active:scale-95">
                    Добавить
                </button>
            </form>

            <!-- Кнопки фильтрации списка задач -->
            <div id="filters" class="flex gap-2 mb-6">
                <button data-filter="all" class="filter-btn active px-6 py-3 rounded-2xl text-sm font-medium">Все</button>
                <button data-filter="active" class="filter-btn px-6 py-3 rounded-2xl text-sm font-medium">Активные</button>
                <button data-filter="completed" class="filter-btn px-6 py-3 rounded-2xl text-sm font-medium">Выполненные</button>
            </div>

            <!-- Пустой список, куда JavaScript будет добавлять задачи -->
            <ul id="taskList" class="space-y-3 min-h-[320px]"></ul>

            <!-- Нижняя панель со счетчиком и кнопками управления -->
            <div class="mt-10 flex justify-between items-center text-sm">
                <span id="stats" class="text-zinc-500 font-medium">0 задач • 0 выполнено</span>
                
                <div class="flex gap-4">
                    <button id="loadSamples" class="text-emerald-400 hover:text-emerald-300 font-medium flex items-center gap-2 transition">
                        <i class="fas fa-cloud-download-alt"></i> Загрузить с сервера
                    </button>
                    <button id="clearCompleted" class="text-red-400 hover:text-red-300 font-medium transition">
                        Очистить выполненные
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Подключаем главный скрипт как ES6-модуль -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
